<script>window.BG_SEQ={"slug": "tk-dich-vu", "title": "Thiết kế mạng bắt đầu từ dịch vụ", "crumb": [{"t": "Thiết kế và hiệu năng mạng · Tiết 1", "href": "./"}], "next": {"title": "Gói tin qua ba chặng", "href": "goi-tin/", "sub": "Tiết 2"}, "cover": "anh/tk-dich-vu.webp", "subject": "Thiết kế và hiệu năng mạng · Tiết 1", "pack": "dich-vu/giao-an/", "plan": [{"t": "Một mạng trường, bốn dịch vụ khác nhau", "m": [0, 3], "gv": "Chiếu toàn cảnh: giảng đường, camera, phòng máy, router biên, đường WAN ra đám mây. Chỉ bốn màu gói là bốn dịch vụ. Hỏi: thiết bị đều chạy, vậy vì sao màn chiếu giảng đường xám và bảng 01 báo hai dịch vụ chưa đạt? Ghi hai ba giả thuyết của lớp lên góc bảng.", "hs": "Quan sát bảng 01, nêu giả thuyết, ghi vào lề vở."}, {"t": "Từ yêu cầu tới kiểm chứng và quay lại", "m": [3, 6], "gv": "Vẽ hình 1.1 thành năm khối nối tiếp: yêu cầu, thiết kế, mô hình hoá, đo kiểm, kết luận; thêm hai mũi tên phản hồi. Chuyển góc nhìn Đường WAN, chỉ gói đỏ rơi ở cổng ra: đó là kết quả đo, phải quay về sửa thiết kế chứ không sửa kết luận.", "hs": "Chép sơ đồ năm khối và hai vòng phản hồi."}, {"t": "Mạng, thiết kế mạng, hiệu năng mạng", "m": [6, 9], "gv": "Đọc chậm ba định nghĩa ở mục 1.2.1, gạch chân cụm \"tập yêu cầu dịch vụ đã được lượng hoá\" và danh sách tham số hiệu năng. Nêu ITU-T Y.1540 là nơi định nghĩa các tham số truyền gói IP.", "hs": "Ghi ba định nghĩa; khoanh các tham số hiệu năng."}, {"t": "Thiết kế là một ánh xạ", "m": [9, 12], "gv": "Viết (1.1), giải thích R_svc, C_env, X_net bằng bảng 02. Bấm Ưu tiên lớp học: lớp học hết mất gói, sao lưu hụt. Nhấn mạnh mỗi quyết định phải có căn cứ từ một yêu cầu. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Ghi (1.1); trả lời câu hỏi chọn quyết định có căn cứ."}, {"t": "Không tối ưu được mọi thứ cùng lúc", "m": [12, 16], "gv": "Viết (1.2). Bấm lần lượt ba phương án ở bảng 03, đọc D, mất gói, chi phí, A, J của từng phương án. Giải ví dụ 4 trên bảng: đổi α3 từ 1 lên 3, thứ hạng giữ nguyên nhưng khoảng cách giữa Cân bằng và Mua băng thông giãn ra. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Ghi (1.2); điền bảng J của ba phương án vào vở; trả lời câu hỏi."}, {"t": "Chu trình sáu bước và vòng phản hồi", "m": [16, 19], "gv": "Vẽ vòng sáu bước của hình 1.2. Viết (1.3), gọi tên x_k, u_k, w_k, y_k. Kéo Tải lớp học lên 1,3 (nhiễu w_k): phương án Cân bằng vẫn đạt. Tắt Sao lưu ban đêm (sao lưu chạy bù giờ học): lớp học vẫn đạt nhờ ưu tiên, sao lưu hụt goodput. Hỏi: u_k nên là gì?", "hs": "Ghi (1.3); đề xuất một hành động u_k cho tình huống sao lưu chạy bù."}, {"t": "Yêu cầu, QoS, SLA, metric khác nhau thế nào", "m": [19, 23], "gv": "Dùng khung bốn cột đã kẻ. Cùng lớp điền cho lớp học trực tuyến: yêu cầu (hình ổn định, tiếng không đứt), QoS (ưu tiên hàng đợi), SLA (trễ ≤ 100 ms, mất < 10⁻³, sẵn sàng 99,95 %), metric (trễ một chiều RFC 7679, mất gói RFC 7680, biến thiên trễ RFC 3393). Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Điền bảng bốn cột vào vở; trả lời câu hỏi phân loại."}, {"t": "Luồng lưu lượng và năm nhóm thông tin", "m": [23, 26], "gv": "Nêu định nghĩa luồng và mô hình (mục 1.3.2). Chỉ bốn màu gói trên cảnh là bốn luồng. Liệt kê năm nhóm thông tin; với mỗi nhóm nêu hậu quả khi thiếu.", "hs": "Ghi năm nhóm thông tin và hậu quả khi thiếu từng nhóm."}, {"t": "Mạng là một đồ thị có thuộc tính", "m": [26, 30], "gv": "Bấm Đồ thị G = (V, E). Viết (1.4), (1.5). Đếm cùng lớp số nút, số cạnh có hướng. Đọc vector c_ij của cạnh WAN ở bảng 06. Nhấn mạnh băng thông cao chưa đủ: q_ij đổi thì kết quả lớp học đổi.", "hs": "Vẽ đồ thị mạng trường vào vở, ghi vector c_ij của cạnh WAN."}, {"t": "Ba mặt phẳng: dữ liệu, điều khiển, quản lý", "m": [30, 33], "gv": "Bấm Ba mặt phẳng: gói bốn màu là dữ liệu, hạt tím là điều khiển, hạt vàng là quản lý. Nêu định nghĩa SDN (RFC 7426), NFV; YANG, NETCONF, RESTCONF, NMDA mỗi thứ một câu.", "hs": "Ghi chức năng ba mặt phẳng và vai trò của YANG, NETCONF, RESTCONF, NMDA."}, {"t": "Mỗi dịch vụ một vector yêu cầu", "m": [33, 37], "gv": "Viết (1.6). Bấm r Lớp học, r Camera, r Sao lưu ở bảng 04 để thấy ba vector khác nhau. Giải ví dụ 5 trên bảng: vector của lớp học và ba metric cần đo. Nhắc ngưỡng trễ và mất lấy theo các lớp QoS của ITU-T Y.1541. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Chép vector của lớp học; trả lời câu hỏi về ô không quy định."}, {"t": "Đạt hay không đạt là phép so sánh", "m": [37, 42], "gv": "Viết (1.8). Đọc ma trận ở bảng 05. Tắt Hai đường WAN: lớp học hụt ô độ sẵn sàng. Giải ví dụ 3 trên bảng. Cho làm câu 6 phiếu bài tập trong 3 phút, gọi một sinh viên đọc kết luận. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Làm câu 6 phiếu bài tập; trả lời câu hỏi về ô còn hụt."}, {"t": "Không bắt đầu từ việc chọn thiết bị", "m": [42, 45], "gv": "Quay về giả thuyết đầu tiết, so với kết luận: nghẽn ở cổng WAN và lịch sao lưu, không ở thiết bị. Chốt chuỗi năm bước. Giao câu 1, 2, 7 cuối chương 1 và câu 4, 5 phiếu bài tập. Báo tiết sau: độ trễ đầu cuối.", "hs": "Đối chiếu giả thuyết; ghi bài về nhà."}]};</script>
