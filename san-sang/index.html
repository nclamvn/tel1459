<script>window.BG_SEQ={"slug": "tk-san-sang", "title": "Độ sẵn sàng, RTO và RPO", "crumb": [{"t": "Thiết kế và hiệu năng mạng · Tiết 4", "href": "./"}], "next": {"title": "Vòng vận hành có kiểm chứng", "href": "van-hanh/", "sub": "Tiết 5"}, "cover": "anh/tk-san-sang.webp", "subject": "Thiết kế và hiệu năng mạng · Tiết 4", "pack": "san-sang/giao-an/", "plan": [{"t": "Hai đường lên có chắc gấp đôi?", "m": [0, 3], "gv": "Chiếu toàn cảnh: trường, nhà cung cấp, hai đường cáp. Hỏi: mỗi đường A = 0,999, hai đường thì cả hệ bao nhiêu? Ghi các dự đoán của lớp lên góc bảng (thường là 0,999999).", "hs": "Ghi dự đoán của mình."}, {"t": "Sẵn sàng, tin cậy, bảo trì là ba chuyện khác nhau", "m": [3, 6], "gv": "Nêu ba định nghĩa theo mục 1.6.5 và 2.5.1. Cho ví dụ đời thường: xe máy hay hỏng nhưng sửa trong 5 phút (tin cậy thấp, sẵn sàng cao). Nhấn mạnh ba khái niệm áp cả cho quy trình vận hành.", "hs": "Ghi ba định nghĩa và một ví dụ của mình."}, {"t": "Độ tin cậy giảm dần theo thời gian", "m": [6, 9], "gv": "Viết (2.17), giải thích λ = 1/MTBF khi phân bố mũ. Giải ví dụ 2 trên bảng: R(1 tháng) và R(1 năm) với MTBF 2 000 h. Chỉ dòng R một năm ở bảng 02.", "hs": "Tính R(730 h) và R(8 766 h) cùng giảng viên."}, {"t": "MTBF 2 000 giờ, MTTR 2 giờ", "m": [9, 12], "gv": "Viết (1.19) và (2.18). Giải bài tập 8 chương 2 (ví dụ 1). Cùng lớp điền bảng quy đổi số chín. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Điền bảng quy đổi; trả lời câu hỏi."}, {"t": "Hai cách tăng độ sẵn sàng", "m": [12, 15], "gv": "Kéo MTBF lên 10 000 h, rồi trả về và kéo MTTR xuống 0,5 h: hai cách cho A gần bằng nhau. Liệt kê biện pháp cho mỗi hướng theo giáo trình. Hỏi: cách nào thường rẻ hơn với một trường đại học?", "hs": "Ghi biện pháp tăng MTBF, giảm MTTR (phần thứ hai của bài tập 8)."}, {"t": "Một gầu máy xúc, hai sợi cáp", "m": [15, 19], "gv": "Chọn Chung một ống, góc Phố trước, bấm Máy xúc đào. Cho lớp thấy cả hai đường đứt. Định nghĩa miền lỗi chung; kể thêm ví dụ: chung cột điện, chung nguồn, chung phòng máy.", "hs": "Ghi định nghĩa miền lỗi chung và ba ví dụ."}, {"t": "Đường B đi ngõ sau", "m": [19, 23], "gv": "Chọn Tách hai ngả, đào lại. Viết (4.14). Giải ví dụ 3 trên bảng: A của hai cấu trúc và phút ngừng mỗi năm. Đối chiếu với dự đoán đầu tiết. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Làm ví dụ 3; so với dự đoán; trả lời câu hỏi."}, {"t": "RTO càng nhỏ càng đắt", "m": [23, 26], "gv": "Vẽ phác hình 1.6: hai đường cong chi phí phục hồi và tổn thất theo RTO. Kéo RTO từ 1 giờ xuống 1 phút, chỉ đồng hồ đổi màu. Hỏi: RTO nào cho thi trực tuyến, RTO nào cho trang tin tức của trường?", "hs": "Đề xuất RTO cho hai dịch vụ, có lý do."}, {"t": "Bốn pha của một lần phục hồi", "m": [26, 30], "gv": "Viết (2.19). Chọn Chung một ống, đào: đọc bốn pha trên đồng hồ và bảng 04. Giải ví dụ 4 phần chung ống. Hỏi: pha nào chiếm nhiều nhất, đầu tư vào đâu?", "hs": "Ghi bốn pha và thời gian từng pha."}, {"t": "Phát hiện chậm cũng là ngừng", "m": [30, 33], "gv": "Chọn Tách hai ngả, OSPF hello, hỏng cổng A: đọc 40 s phát hiện. Đổi sang BFD, làm lại. Giải ví dụ 4 phần tách ngả. Nêu RFC 5880 (BFD), RFC 2328 (OSPF).", "hs": "So sánh tổng thời gian phục hồi với OSPF và BFD."}, {"t": "Mất bao nhiêu dữ liệu thì chấp nhận được", "m": [33, 37], "gv": "Định nghĩa RPO theo mục 2.5.2, vẽ phác trục thời gian hình 1.7 (bản chụp, lỗi, khôi phục). Kéo chu kỳ sao lưu lên 72 h rồi xuống 12 h ở bảng 05. Giải ví dụ 5. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Làm ví dụ 5; trả lời câu hỏi."}, {"t": "Công thức và 400 năm mô phỏng", "m": [37, 41], "gv": "Chỉ bảng 03: công thức và Monte Carlo. Hỏi: vì sao lệch? (thời gian chuyển đường). Chỉ bảng 06: ngừng theo nguyên nhân. Nhấn mạnh mô hình phải chứa cả quy trình phục hồi.", "hs": "Ghi hai con số và nguyên nhân lệch."}, {"t": "Dự phòng chỉ có ích khi độc lập", "m": [41, 45], "gv": "Chốt bốn ý: hai hướng tăng A; dự phòng phải độc lập; RTO theo dịch vụ, chia bốn pha; sao lưu không dài hơn RPO. Giao bài tập 8 chương 2 và phiếu câu 2–6. Báo tiết sau: vòng vận hành có kiểm chứng.", "hs": "Ghi bốn ý và bài về nhà."}]};</script>
