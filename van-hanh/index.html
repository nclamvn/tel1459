<script>window.BG_SEQ={"slug": "tk-van-hanh", "title": "Vòng vận hành có kiểm chứng", "crumb": [{"t": "Thiết kế và hiệu năng mạng · Tiết 5", "href": "./"}], "next": {"title": "Đếm tải thật", "href": "dem-tai/", "sub": "Tiết 7"}, "cover": "anh/tk-van-hanh.webp", "subject": "Thiết kế và hiệu năng mạng · Tiết 5", "pack": "van-hanh/giao-an/", "plan": [{"t": "Mạng đã chạy, làm sao biết nó còn đạt?", "m": [0, 3], "gv": "Chiếu toàn cảnh: sáu thiết bị, liên kết xanh có bùng nổ, phòng vận hành. Hỏi: nếu chỉ xem mức sử dụng trung bình mỗi giờ, người vận hành có thấy nghẽn 20 giây không?", "hs": "Trả lời, nêu một ví dụ hiện tượng ngắn."}, {"t": "Ba hướng đánh giá và một kế hoạch đánh giá", "m": [3, 7], "gv": "Nêu ba hướng đánh giá theo 1.7.1 và ưu, nhược mỗi hướng. Viết (1.20), giải thích M, F, L, S, A bằng chính bài này: M là mức sử dụng, F là chu kỳ đo, L là các mức 1 s, 10 s, 300 s, S là chuỗi tải có bùng nổ, A là đếm số đợt bắt được. Nêu các thông tin bảng 1.3 đòi khi báo cáo.", "hs": "Ghi (1.20) và điền năm thành phần cho thí nghiệm trong cảnh."}, {"t": "Hỏi định kỳ bỏ lỡ đợt bùng nổ", "m": [7, 10], "gv": "Bấm SNMP 5 phút, góc Màn hình. Chỉ đường xám và đường xanh. Giải ví dụ 1 phần polling trên bảng.", "hs": "Tính mức sử dụng trung bình 5 phút của ví dụ 1."}, {"t": "Thiết bị tự đẩy dữ liệu", "m": [10, 13], "gv": "Bấm Telemetry 1 s. Chỉ bảng 03 (bắt được) và bảng 05 (chi phí). Nêu RFC 9232, 8639, 8641. Giải ví dụ 1 phần chi phí. Cho lớp trả lời câu hỏi trên màn hình. Dàn ý câu 6.", "hs": "So sánh hai cách theo ba tiêu chí; trả lời câu hỏi."}, {"t": "Sai lệch giữa trạng thái đo và mục tiêu", "m": [13, 16], "gv": "Viết (1.21), y* = 0,8 lấy từ η của tiết 2. Chỉ bảng 02. Nêu ba phản ứng khi Δ vượt ngưỡng: cảnh báo, phân tích nguyên nhân, tự phục hồi. Chỉ bảng 06: vòng khép kín không nhanh hơn khâu đo.", "hs": "Ghi (1.21) và ba phản ứng."}, {"t": "Đo nhiều chưa chắc thấy đủ", "m": [16, 19], "gv": "Viết (1.28). Bấm lần lượt các nút metric, đọc Γ ở bảng 04. Giải ví dụ 2. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Làm ví dụ 2; trả lời câu hỏi."}, {"t": "Từ mạng IP sang mạng dịch vụ lập trình được", "m": [19, 23], "gv": "Nêu nút thắt mới theo 1.8.1: ánh xạ yêu cầu thành tài nguyên, chính sách, cô lập, giám sát. Định nghĩa 5GS (AMF, SMF, UPF) và 5G-Advanced (từ Release 18). Bắt đầu bảng ba cột trên bảng: công nghệ, metric tác động, dữ liệu cần đo.", "hs": "Kẻ bảng ba cột vào vở."}, {"t": "Lát cắt mạng không phải VLAN", "m": [23, 27], "gv": "Viết (1.22), giải thích năm thành phần. So sánh VLAN, VPN, lát cắt theo phạm vi, mức cô lập, cách kiểm chứng SLA (dàn ý câu 8). Nhấn M_n: nối với Γ ở bước 6. Điền một dòng bảng ba cột.", "hs": "Ghi (1.22); điền bảng so sánh ba khái niệm."}, {"t": "Xử lý ở biên chỉ có lợi khi tổng trễ nhỏ hơn", "m": [27, 30], "gv": "Viết (1.23). Giải ví dụ 3 trên bảng: tập trung, biên bình thường, biên quá tải. Dàn ý câu 9: giảm trễ truyền tải nhưng thêm bài toán vị trí, đồng bộ, di động phiên.", "hs": "Làm ví dụ 3; ghi dàn ý câu 9."}, {"t": "Vòng điều khiển cần dữ liệu đo tin được", "m": [30, 33], "gv": "Viết (1.24). Tắt Đo chủ động trên cảnh: Γ tụt. Hỏi: bộ điều khiển thiếu dữ liệu đo z_t về trễ thì quyết định thế nào? Nêu xApp, rApp. Phân biệt AI for Network và Network for AI, mỗi hướng một metric kiểm chứng (dàn ý câu 10).", "hs": "Ghi (1.24); nêu một metric cho mỗi hướng AI/ML."}, {"t": "Trễ lan truyền biến thiên và metric cảm nhận", "m": [33, 37], "gv": "Viết (1.25). Giải ví dụ 4: UAV, vệ tinh quỹ đạo thấp, địa tĩnh. Dàn ý câu 11: trễ, ngân sách đường truyền, handover thay đổi theo hình học. Viết (1.26), nêu metric cảm nhận (dàn ý câu 12). Nhắc 6G gọi là IMT-2030, sáu nhóm kịch bản theo ITU-R M.2160.", "hs": "Làm ví dụ 4; ghi metric cảm nhận."}, {"t": "Bảo mật, chống chịu, năng lượng là ràng buộc từ đầu", "m": [37, 41], "gv": "Định nghĩa resilience. Nêu bốn câu hỏi an toàn của 1.9.1. Viết (1.27), giải ví dụ 5. Kéo chu kỳ telemetry về 1 s: chi phí thu thập cũng là năng lượng. Dàn ý câu 13.", "hs": "Làm ví dụ 5; ghi bốn câu hỏi an toàn."}, {"t": "Bốn câu hỏi trước mọi công nghệ mới", "m": [41, 45], "gv": "Điền nhanh bảng 1.5 rút gọn cùng lớp. Chốt bốn câu hỏi của 1.10.2. Giao câu 6, 8–13 chương 1 (phiếu bài tập). Báo tiết sau: chương 2, từ \"mạng phải nhanh\" đến vector yêu cầu.", "hs": "Điền bảng 1.5; ghi bốn câu hỏi và bài về nhà."}]};</script>
