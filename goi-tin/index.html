<script>window.BG_SEQ={"slug": "tk-goi-tin", "title": "Gói tin qua ba chặng", "crumb": [{"t": "Thiết kế và hiệu năng mạng · Tiết 2", "href": "./"}], "next": {"title": "Khi hàng đợi đầy", "href": "hang-doi/", "sub": "Tiết 3"}, "cover": "anh/tk-goi-tin.webp", "subject": "Thiết kế và hiệu năng mạng · Tiết 2", "pack": "goi-tin/giao-an/", "plan": [{"t": "Một gói tin đi từ lớp học tới máy chủ học liệu", "m": [0, 4], "gv": "Hỏi lớp: khi một trang học liệu mở chậm, chậm ở đâu? Ghi ba bốn câu trả lời lên góc bảng. Chỉ trên cảnh ba chặng: máy học viên, tủ truy nhập, router biên, đường WAN, trung tâm dữ liệu. Nêu định nghĩa độ trễ một chiều theo điều kiện đo xác định (RFC 7679).", "hs": "Đoán thành phần chiếm phần lớn độ trễ, ghi vào lề vở để so cuối tiết."}, {"t": "Độ trễ đầu cuối là tổng bốn thành phần", "m": [4, 9], "gv": "Viết (1.10) lên bảng, giải thích từng số hạng: lan truyền, truyền, chờ, xử lý; nhấn mạnh tổng lấy trên mọi liên kết e của đường P. Bấm Gửi gói tin, chỉ màu từng pha trên gói và bảng 04.", "hs": "Chép (1.10), ghi màu tương ứng mỗi thành phần."}, {"t": "Gói lớn trên liên kết chậm", "m": [9, 13], "gv": "Giải ví dụ 1 trên bảng: 1 500 byte trên 100 Mbit/s và 10 Gbit/s. Kéo tốc độ WAN xuống 10 Mbit/s để lớp thấy thành phần cam lớn gấp mười. Hỏi câu trắc nghiệm trên màn chiếu.", "hs": "Tính cùng giảng viên, trả lời câu hỏi trên màn chiếu."}, {"t": "Khoảng cách thì không mua được", "m": [13, 17], "gv": "Nêu v ≈ 2·10⁸ m/s trong cáp, tính 60 m, 2 km, 300 km. Kéo độ dài WAN lên 1 000 km, chỉ thanh xanh lớn dần trong khi tốc độ cổng không đổi.", "hs": "Tính dprop cho ba khoảng cách, điền cột lan truyền trong bảng của ví dụ 2."}, {"t": "Mỗi nút cần thời gian đọc và chuyển gói", "m": [17, 20], "gv": "Liệt kê việc một router làm với mỗi gói: đọc tiêu đề, tra bảng, áp chính sách. Nói rõ 5 µs và 20 µs là giả định của bài; số thật phụ thuộc thiết bị và tính năng bật. Hoàn tất bảng ví dụ 2: tổng khoảng 1,81 ms.", "hs": "Cộng bốn thành phần cho ba chặng, đối chiếu với tổng trên bảng 04."}, {"t": "Mức sử dụng của một liên kết", "m": [20, 23], "gv": "Viết (1.7). Giải thích luồng f đi qua liên kết e; trên WAN của bài, gói của ta chia cổng với lưu lượng nền. Kéo tải nền về 0,3 để có điểm xuất phát.", "hs": "Chép (1.7), nêu một ví dụ ba luồng cùng đi qua một liên kết."}, {"t": "Khi tải tiến gần 1", "m": [23, 28], "gv": "Kéo tải nền lên 0,9, chỉ cột hàng đợi ở router biên. Giải ví dụ 4 bằng M/M/1: μ = C/L, λ = ρμ, Wq = ρ/(μ − λ). Hỏi câu trắc nghiệm.", "hs": "Tính Wq ở ρ = 0,5 và 0,9, rút ra tỉ số 9 lần."}, {"t": "Số trên màn hình không gõ sẵn", "m": [28, 31], "gv": "Chỉ bảng 05: chấm đỏ là mô phỏng hàng chục nghìn gói, đường liền là M/M/1. Giải thích ý nghĩa kiểm chứng mô hình (sẽ học kỹ ở tiết 17).", "hs": "Nêu một lý do cần đối chiếu mô phỏng với lý thuyết trước khi tin kết quả."}, {"t": "Thành phần nào giảm khi tăng tốc độ cổng?", "m": [31, 35], "gv": "Giao bài 1 trên phiếu (câu 3 cuối chương), cho 3 phút. Gọi một sinh viên trình bày; chốt: tăng C giảm dtx và gián tiếp dqueue; dprop theo khoảng cách, dproc theo thiết bị. Hỏi câu trắc nghiệm.", "hs": "Làm bài 1 trên phiếu, trình bày khi được gọi."}, {"t": "Đủ băng thông chưa chắc đã đủ", "m": [35, 38], "gv": "Bấm BT 1.4, giải câu 4 cuối chương: ρ = 0,8, dư địa bằng 0 với η = 0,8. Kéo dữ liệu nền lên 520 Mbit/s để thấy vượt ngưỡng. Nhấn mạnh (1.9): quy hoạch theo η·C, không theo C.", "hs": "Làm bài 4 trên phiếu, giải thích vì sao dư địa bằng 0 vẫn là vấn đề."}, {"t": "Không phải chậm nào cũng do mạng", "m": [38, 41], "gv": "Viết (1.12). Đặt máy chủ xử lý 150 ms, nâng WAN lên 1 Gbit/s: thời gian đáp ứng gần như không đổi. Giải ví dụ 5. Quay lại câu đoán đầu giờ.", "hs": "So câu đoán đầu giờ với kết quả; chỉ ra khi nào nâng băng thông là vô ích."}, {"t": "Một chiều hay khứ hồi, đo ở đâu", "m": [41, 43], "gv": "Phân biệt độ trễ một chiều (cần đồng bộ đồng hồ) với thời gian khứ hồi của ping. Liệt kê điều kiện đo phải ghi: điểm đo, kích thước gói, mức tải, thời gian đo, số lần lặp.", "hs": "Ghi danh sách điều kiện đo vào vở."}, {"t": "Thiết kế can thiệp vào đâu", "m": [43, 45], "gv": "Tóm tắt bốn đòn bẩy thiết kế theo bốn thành phần. Chiếu 6 câu kiểm tra nhanh, lớp trả lời đồng thanh hoặc giơ tay; giao bài 2, 3, 5, 6 về nhà. Giới thiệu tiết 3: hàng đợi đầy thì mất gói.", "hs": "Trả lời kiểm tra nhanh; ghi bài tập về nhà."}]};</script>
