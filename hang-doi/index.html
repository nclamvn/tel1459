<script>window.BG_SEQ={"slug": "tk-hang-doi", "title": "Khi hàng đợi đầy", "crumb": [{"t": "Thiết kế và hiệu năng mạng · Tiết 3", "href": "./"}], "next": {"title": "Độ sẵn sàng, RTO và RPO", "href": "san-sang/", "sub": "Tiết 4"}, "cover": "anh/tk-hang-doi.webp", "subject": "Thiết kế và hiệu năng mạng · Tiết 3", "pack": "hang-doi/giao-an/", "plan": [{"t": "Một cổng ra, ba nguồn, một bộ đệm có hạn", "m": [0, 3], "gv": "Nhắc lại một câu của tiết 2: trễ hàng đợi tăng nhanh khi ρ tiến tới 1. Chiếu toàn cảnh: ba nguồn, router có ống bộ đệm, đường WAN, bảng trễ ở máy nhận. Nêu ba câu hỏi của tiết: gói có tới không, trễ có đều không, ứng dụng nhận được bao nhiêu.", "hs": "Ghi ba câu hỏi đo của tiết."}, {"t": "Gói bị bỏ khi bộ đệm đầy", "m": [3, 6], "gv": "Chuyển góc Bộ đệm. Chỉ gói cam đang phát, gói đỏ rơi khi ống đủ K gói. Kéo K xuống 8, cho lớp đếm số gói rơi trong 20 giây. Viết (1.15).", "hs": "Đếm gói rơi; ghi (1.15)."}, {"t": "Đếm mất gói ở đâu, đếm thế nào", "m": [6, 9], "gv": "Hỏi lớp: đếm N_tx ở đâu, N_rx ở đâu, trong bao lâu? Nêu RFC 7680 (mất gói một chiều, IPPM). Liệt kê năm nguyên nhân dưới (1.15): lỗi đường truyền, tràn hàng đợi, policing, định tuyến không ổn định, lỗi thiết bị. Giải ví dụ 1 trên bảng.", "hs": "Ghi năm nguyên nhân; làm ví dụ 1 cùng giảng viên."}, {"t": "Nguồn không biết cổng đang đầy", "m": [9, 13], "gv": "Đẩy tải lên 1,3. Cho lớp nhìn hàng chạm vạch K và nằm lì. Dẫn ra P_loss → 1 − 1/ρ bằng lập luận bảo toàn: cổng chỉ phát được μ, phần λ − μ phải rơi. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Ghi giới hạn 1 − 1/ρ và lập luận; trả lời câu hỏi."}, {"t": "Biến thiên trễ không phải là trễ lớn", "m": [13, 16], "gv": "Chuyển góc Bảng trễ. Mỗi chấm là trễ một chiều của một gói. Viết (1.13), nêu RFC 3393. Nhấn mạnh: trễ trung bình có thể đạt ngưỡng mà thoại, video hội nghị vẫn hỏng vì trễ dao động.", "hs": "Ghi (1.13) và ví dụ dịch vụ nhạy với biến thiên trễ."}, {"t": "Tính J từ một chuỗi trễ", "m": [16, 20], "gv": "Viết (1.14). Giải ví dụ 2 với chuỗi đã ghi sẵn trên bảng. Chỉ ra một gói trễ bất thường làm J tăng mạnh. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Tính J cho chuỗi sáu gói; trả lời câu hỏi."}, {"t": "Jitter tăng theo tải", "m": [20, 23], "gv": "Kéo tải 0,5 rồi 0,95, cho lớp so độ tản của các chấm và con số J ở bảng 04. Nêu cách đọc của giáo trình: J tăng theo tải thì nghi hàng đợi, phân lớp QoS hoặc chính sách ưu tiên.", "hs": "Ghi J ở hai mức tải; ghi cách đọc."}, {"t": "Gói dài thì dễ hỏng hơn", "m": [23, 27], "gv": "Viết (1.16), nêu giả thiết lỗi bit độc lập. Kéo cỡ gói lên 1 500 byte, BER lên 10⁻⁵: goodput tụt, thông lượng đứng yên. Giải ví dụ 3, nhấn mạnh khi nào xấp xỉ L·P_b hết đúng.", "hs": "Làm ví dụ 3; ghi điều kiện dùng xấp xỉ."}, {"t": "Thông lượng phải kèm điều kiện đo", "m": [27, 30], "gv": "Viết (1.17). Nêu RFC 2544 (kiểm chuẩn thiết bị) và RFC 6349 (thông lượng TCP). Liệt kê năm điều kiện phải báo cáo kèm: cỡ gói, mô hình lưu lượng, giao thức, số luồng, điều kiện tải.", "hs": "Ghi (1.17) và năm điều kiện báo cáo."}, {"t": "Liên kết bận chưa chắc ứng dụng nhận đủ", "m": [30, 34], "gv": "Viết (1.18). Kéo cỡ gói xuống 64 byte: goodput tụt mạnh. Giải ví dụ 4 trên bảng. Trả lời câu 5 cùng lớp. Cho lớp trả lời câu hỏi trên màn hình.", "hs": "Làm ví dụ 4; ghi dàn ý trả lời câu 5; trả lời câu hỏi."}, {"t": "Bộ đệm lớn không chữa được quá tải", "m": [34, 38], "gv": "Bấm Bộ đệm lớn, rồi đẩy tải lên 1,3. Vẽ bảng bốn ô (K = 16, 64 × ρ = 0,85, 1,3) của ví dụ 5, điền từ bảng 06. Kết luận: bộ đệm đổi mất gói lấy trễ; quá tải chỉ chữa bằng giảm ρ.", "hs": "Điền bảng bốn ô; ghi kết luận."}, {"t": "Ba con số, ba cách tính", "m": [38, 41], "gv": "Chỉ bảng 03: mất gói đếm trong cảnh, mô phỏng 30 000 gói, lời giải M/M/1/K. Hỏi: lệch nhau thì nghi gì trước? Nhắc mục 5.1.3 về kiểm mô hình.", "hs": "Ghi ba con số và nhận xét độ khớp."}, {"t": "Năm metric, mỗi metric một điều kiện đo", "m": [41, 45], "gv": "Chốt năm metric (1.13)–(1.18) và ba ý cần nhớ. Giao câu 5 cuối chương 1 và phiếu bài tập câu 2–6. Báo tiết sau: độ sẵn sàng, RTO và RPO.", "hs": "Ghi năm metric và bài về nhà."}]};</script>
